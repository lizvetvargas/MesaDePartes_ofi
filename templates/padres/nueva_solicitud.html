{% extends "base.html" %}{% block title %}Nueva solicitud{% endblock %}{% block content %}<div class="heading"><p class="eyebrow">MESA DE PARTES</p><h1>Presentar una solicitud</h1><p>Completa los datos para registrar tu trámite.</p></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Tipo de trámite</label><select name="tipo" required><option value="">Selecciona</option><option>Solicitud de constancia</option><option>Actualización de datos</option><option>Justificación de inasistencia</option><option>Solicitud general</option><option>Otro</option></select><label>Estudiante relacionado (opcional)</label><select name="estudiante_id"><option value="">No corresponde</option>{% for e in estudiantes %}<option value="{{ e.id }}">{{ e.apellidos }}, {{ e.nombres }} — {{ e.grado }} {{ e.seccion }}</option>{% endfor %}</select><label>Asunto</label><input name="asunto" required maxlength="250"><label>Descripción</label><textarea name="descripcion" rows="5"></textarea><button class="button gold">Enviar solicitud</button></form></div>{% endblock %}
