{% extends "base.html" %}{% block title %}Crear usuario{% endblock %}{% block content %}<div class="heading"><p class="eyebrow">CONTROL DE ACCESO</p><h1>Crear usuario</h1></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre</label><input name="nombre" required><label>Correo</label><input type="email" name="correo" required><label>Rol</label><select name="rol">{% for r in ['padre','secretaria','personal','administrador','direccion'] %}<option value="{{ r }}">{{ r|title }}</option>{% endfor %}</select><label>Contraseña (mínimo 12 caracteres)</label><input type="password" name="password" minlength="12" required><button class="button gold">Crear usuario</button></form></div>{% endblock %}
