{% extends "base.html" %}{% block title %}Editar usuario{% endblock %}{% block content %}<div class="heading"><p class="eyebrow">CONTROL DE ACCESO</p><h1>Editar usuario</h1></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Nombre</label><input name="nombre" value="{{ usuario.nombre }}" required><label>Correo</label><input value="{{ usuario.correo }}" disabled><label>Rol</label><select name="rol">{% for r in ['padre','secretaria','personal','administrador','direccion'] %}<option value="{{ r }}" {% if usuario.rol==r %}selected{% endif %}>{{ r|title }}</option>{% endfor %}</select><button class="button gold">Guardar</button></form></div>{% endblock %}
