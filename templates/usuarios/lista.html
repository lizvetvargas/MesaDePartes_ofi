{% extends "base.html" %}{% block title %}Usuarios{% endblock %}{% block content %}<div class="heading rowhead"><div><p class="eyebrow">CONTROL DE ACCESO</p><h1>Usuarios</h1></div><a class="button gold" href="{{ url_for('usuarios.crear') }}">＋ Crear usuario</a></div><div class="table-wrap"><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th><th>Estado</th><th>Acciones</th></tr>{% for u in usuarios %}<tr><td>{{ u.nombre }}</td><td>{{ u.correo }}</td><td>{{ u.rol }}</td><td>{{ 'Activo' if u.activo else 'Inactivo' }}</td><td><a href="{{ url_for('usuarios.editar',usuario_id=u.id) }}">Editar</a><form class="inline" method="post" action="{{ url_for('usuarios.cambiar_estado',usuario_id=u.id) }}"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button class="nav-button">{{ 'Desactivar' if u.activo else 'Activar' }}</button></form></td></tr>{% endfor %}</table></div>{% endblock %}
