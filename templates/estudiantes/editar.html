{% extends "base.html" %}
{% block title %}Editar estudiante{% endblock %}
{% block content %}
<style>
.est-edit{max-width:900px;margin:auto;color:#172b4d}
.est-edit .eyebrow{color:#a47d35;font-size:12px;font-weight:700;letter-spacing:2px}
.est-edit h1{margin:8px 0;font-size:30px}
.est-edit .muted{color:#667085;line-height:1.5}
.est-edit .card{margin-top:24px;padding:28px;background:#fffdf8;border:1px solid #e6dfd0;border-radius:10px;box-shadow:0 6px 20px #172b4d0d}
.est-edit .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 20px}
.est-edit .field{display:flex;flex-direction:column;gap:7px;min-width:0}
.est-edit label{font-size:13px;font-weight:700}
.est-edit input,.est-edit select{box-sizing:border-box;width:100%;min-height:44px;padding:10px 12px;border:1px solid #d8dce4;border-radius:6px;background:white;color:#172b4d;font:inherit}
.est-edit input:focus,.est-edit select:focus{outline:none;border-color:#b18a42;box-shadow:0 0 0 3px #b18a4226}
.est-edit .actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:12px;margin-top:25px;padding-top:20px;border-top:1px solid #e6dfd0}
.est-edit .btn{display:inline-block;padding:11px 18px;border:0;border-radius:6px;background:#b18a42;color:white;text-decoration:none;font-size:13px;font-weight:700;cursor:pointer}
.est-edit .secondary{background:#172b4d}
@media(max-width:600px){.est-edit .grid{grid-template-columns:1fr}.est-edit .card{padding:18px}}
</style>

<div class="est-edit">
    <p class="eyebrow">REGISTRO ESCOLAR</p>
    <h1>Editar perfil del estudiante</h1>
    <p class="muted">Actualiza la información de {{ estudiante.nombres }} {{ estudiante.apellidos }}.</p>

    <div class="card">
        <form method="post">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="grid">
                <div class="field">
                    <label for="nombres">Nombres *</label>
                    <input id="nombres" name="nombres" maxlength="120"
                           value="{{ request.form.get('nombres', estudiante.nombres) }}" required>
                </div>
                <div class="field">
                    <label for="apellidos">Apellidos *</label>
                    <input id="apellidos" name="apellidos" maxlength="120"
                           value="{{ request.form.get('apellidos', estudiante.apellidos) }}" required>
                </div>
                <div class="field">
                    <label for="dni">DNI *</label>
                    <input id="dni" name="dni" type="text" inputmode="numeric"
                           pattern="[0-9]{8}" minlength="8" maxlength="8"
                           value="{{ request.form.get('dni', estudiante.dni or '') }}" required>
                </div>
                <div class="field">
                    <label for="codigo_matricula">Código de matrícula</label>
                    <input id="codigo_matricula" name="codigo_matricula" maxlength="50"
                           value="{{ request.form.get('codigo_matricula', estudiante.codigo_matricula or '') }}">
                </div>
                <div class="field">
                    <label for="nivel">Nivel educativo *</label>
                    <select id="nivel" name="nivel" required>
                        <option value="Inicial" selected>Inicial</option>
                    </select>
                </div>
                <div class="field">
                    <label for="grado">Edad *</label>
                    <select id="grado" name="grado" required>
                        <option value="">Seleccionar edad</option>
                        {% for edad in edades %}
                        <option value="{{ edad }}"
                        {% if request.form.get('grado', estudiante.grado or '') == edad %}selected{% endif %}>
                            {{ edad }}
                        </option>
                        {% endfor %}
                    </select>
                </div>
                <div class="field">
                    <label for="aula">Aula / color</label>
                    <input id="aula" name="aula" list="lista-aulas" maxlength="30"
                           value="{{ request.form.get('aula', estudiante.aula or '') }}">
                    <datalist id="lista-aulas">
                        {% for aula in aulas %}
                        <option value="{{ aula }}">
                        {% endfor %}
                    </datalist>
                </div>
                <div class="field">
                    <label for="seccion">Sección</label>
                    <input id="seccion" name="seccion" maxlength="30"
                           value="{{ request.form.get('seccion', estudiante.seccion or '') }}"
                           placeholder="Ejemplo: A o B">
                </div>
            </div>

            <div class="actions">
                <a class="btn secondary"
                   href="{{ url_for('estudiantes.detalle', estudiante_id=estudiante.id) }}">Cancelar</a>
                <button class="btn" type="submit">Guardar cambios</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
