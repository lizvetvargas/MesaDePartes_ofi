{% extends "base.html" %}{% block title %}Revisar trámite{% endblock %}{% block content %}<div class="heading"><p class="eyebrow">{{ expediente.codigo }}</p><h1>Revisar trámite</h1><p>{{ expediente.asunto }}</p></div><div class="form-card"><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label>Estado</label><select name="estado">{% for s in ['Recibido','En revisión','Observado','Atendido','Rechazado'] %}<option {% if expediente.estado==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select><label>Observaciones para el solicitante</label><textarea name="observaciones" rows="5">{{ expediente.observaciones or '' }}</textarea><button class="button gold">Guardar revisión</button></form></div>{% endblock %}
